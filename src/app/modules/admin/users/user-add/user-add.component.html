<app-navbar></app-navbar>

<div class="form-container">
  <div class="form-wrapper">
    <h2 class="form-title">Ajouter un utilisateur</h2>

    <form (ngSubmit)="addUser()" class="user-form">
      <div class="form-group">
        <label for="nom" class="form-label">
          <i class="bi bi-person-fill"></i> Nom
        </label>
        <input type="text" id="nom" [(ngModel)]="user.nom" name="nom" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">
          <i class="bi bi-envelope-fill"></i> Email
        </label>
        <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="motDePasse" class="form-label">
          <i class="bi bi-lock-fill"></i> Mot de passe
        </label>
        <input type="password" id="motDePasse" [(ngModel)]="user.motDePasse" name="motDePasse" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">
          <i class="bi bi-person-badge-fill"></i> Rôle
        </label>
        <select id="role" [(ngModel)]="user.role" name="role" class="form-select">
          <option value="Admin">Admin</option>
          <option value="chauffeur">Chauffeur</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Enregistrer
        </button>
        <a routerLink="/admin/users" class="btn btn-outline">
          <i class="bi bi-arrow-left"></i> Retour
        </a>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
