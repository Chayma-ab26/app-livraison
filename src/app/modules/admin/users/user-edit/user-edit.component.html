<app-navbar></app-navbar>

<div class="container mt-5"> <!-- Espacement augmenté en haut -->
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2 class="text-center mb-4">Modifier un utilisateur</h2>

      <form (ngSubmit)="updateUser()" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label for="nom" class="form-label">Nom</label>
          <input type="text" id="nom" [(ngModel)]="user.nom" name="nom" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="motDePasse" class="form-label">Nouveau mot de passe (laisser vide si inchangé)</label>
          <input type="password" id="motDePasse" [(ngModel)]="user.motDePasse" name="motDePasse" class="form-control">
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Rôle</label>
          <select id="role" [(ngModel)]="user.role" name="role" class="form-select">
            <option value="Admin">Admin</option>
            <option value="chauffeur">Chauffeur</option>
          </select>
        </div>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">💾 Mettre à jour</button>
          <a routerLink="/admin/users" class="btn btn-secondary ms-2">🔙 Retour</a>
        </div>
      </form>

      <p *ngIf="errorMessage" class="text-danger mt-2 text-center">{{ errorMessage }}</p>
    </div>
  </div>
</div>
