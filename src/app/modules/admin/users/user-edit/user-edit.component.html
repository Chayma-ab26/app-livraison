<app-navbar></app-navbar>

<div class="form-container">
  <div class="form-wrapper">
    <h2 class="form-title">Modifier un utilisateur</h2>

    <form (ngSubmit)="updateUser()" class="user-form">
      <div class="form-group">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" [(ngModel)]="user.nom" name="nom" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-input" required>
      </div>

      <div class="form-group">
        <label for="motDePasse" class="form-label">
          Nouveau mot de passe
          <span class="hint-text">(laisser vide si inchangé)</span>
        </label>
        <input type="password" id="motDePasse" [(ngModel)]="user.motDePasse" name="motDePasse" class="form-input">
      </div>

      <div class="form-group">
        <label for="role" class="form-label">Rôle</label>
        <select id="role" [(ngModel)]="user.role" name="role" class="form-select">
          <option value="Admin">Admin</option>
          <option value="chauffeur">Chauffeur</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-save">
          <i class="bi bi-save"></i> Mettre à jour
        </button>
        <a routerLink="/admin/users" class="btn btn-cancel">
          <i class="bi bi-arrow-left"></i> Retour
        </a>
      </div>

      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>
  </div>
</div>
