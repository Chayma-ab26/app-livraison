<app-navbar></app-navbar> <!-- Navbar en haut -->

<div class="container mt-5"> <!-- Espacement plus grand avec mt-5 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">👥 Liste des utilisateurs</h2>
    <button (click)="navigateToAddUser()" class="btn btn-success shadow">
      ➕ Ajouter un utilisateur
    </button>
  </div>

  <!-- Tableau pour les Admins -->
  <h3 class="text-center mt-4">Admins</h3>
  <div class="table-responsive">
    <table class="table table-striped table-hover shadow-sm">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th colspan="2" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of admins" class="align-middle">
          <td>{{ user.id }}</td>
          <td>{{ user.nom }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge bg-info text-dark">{{ user.role }}</span>
          </td>
          <td class="text-center">
            <button *ngIf="user.id !== null" class="btn btn-warning btn-sm shadow" (click)="editUser(user.id)">
              ✏️ Modifier
            </button>
          </td>
          <td class="text-center">
            <button *ngIf="user.id !== null" class="btn btn-danger btn-sm shadow" (click)="deleteUser(user.id)">
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        <tr *ngIf="admins.length === 0">
          <td colspan="6" class="text-center text-muted">🚫 Aucun admin trouvé.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Tableau pour les Chauffeurs -->
  <h3 class="text-center mt-4">Chauffeurs</h3>
  <div class="table-responsive">
    <table class="table table-striped table-hover shadow-sm">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th colspan="2" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of chauffeurs" class="align-middle">
          <td>{{ user.id }}</td>
          <td>{{ user.nom }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge bg-info text-dark">{{ user.role }}</span>
          </td>
          <td class="text-center">
            <button *ngIf="user.id !== null" class="btn btn-warning btn-sm shadow" (click)="editUser(user.id)">
              ✏️ Modifier
            </button>
          </td>
          <td class="text-center">
            <button *ngIf="user.id !== null" class="btn btn-danger btn-sm shadow" (click)="deleteUser(user.id)">
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        <tr *ngIf="chauffeurs.length === 0">
          <td colspan="6" class="text-center text-muted">🚫 Aucun chauffeur trouvé.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
