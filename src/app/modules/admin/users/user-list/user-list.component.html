<app-navbar></app-navbar>

<div class="content-container">
  <div class="header-section">
    <h2 class="page-title">👥 Gestion des utilisateurs</h2>
    <button (click)="navigateToAddUser()" class="btn btn-add-user">
      <i class="bi bi-plus-circle"></i> Ajouter un utilisateur
    </button>
  </div>

  <!-- Section Admins -->
  <div class="user-section">
    <h3 class="section-title">
      <i class="bi bi-shield-lock"></i> Administrateurs
    </h3>
    <div class="card shadow">
      <div class="table-responsive">
        <table class="table user-table">
          <thead>
            <tr>
              <th width="10%">ID</th>
              <th width="20%">Nom</th>
              <th width="25%">Email</th>
              <th width="15%">Rôle</th>
              <th width="30%" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of admins">
              <td>{{ user.id }}</td>
              <td>{{ user.nom }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge bg-admin">{{ user.role }}</span>
              </td>
              <td class="actions-cell">
                <div class="d-flex justify-content-end gap-2">
                  <button *ngIf="user.id !== null" class="btn btn-edit" (click)="editUser(user.id)">
                    <i class="bi bi-pencil-square"></i> Modifier
                  </button>
                  <button *ngIf="user.id !== null" class="btn btn-delete" (click)="deleteUser(user.id)">
                    <i class="bi bi-trash"></i> Supprimer
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="admins.length === 0">
              <td colspan="5" class="text-center no-data">
                <i class="bi bi-exclamation-circle"></i> Aucun administrateur enregistré
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Section Chauffeurs -->
  <div class="user-section">
    <h3 class="section-title">
      <i class="bi bi-steering-wheel"></i> Chauffeurs
    </h3>
    <div class="card shadow">
      <div class="table-responsive">
        <table class="table user-table">
          <thead>
            <tr>
              <th width="10%">ID</th>
              <th width="20%">Nom</th>
              <th width="25%">Email</th>
              <th width="15%">Rôle</th>
              <th width="30%" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of chauffeurs">
              <td>{{ user.id }}</td>
              <td>{{ user.nom }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge bg-driver">{{ user.role }}</span>
              </td>
              <td class="actions-cell">
                <div class="d-flex justify-content-end gap-2">
                  <button *ngIf="user.id !== null" class="btn btn-edit" (click)="editUser(user.id)">
                    <i class="bi bi-pencil-square"></i> Modifier
                  </button>
                  <button *ngIf="user.id !== null" class="btn btn-delete" (click)="deleteUser(user.id)">
                    <i class="bi bi-trash"></i> Supprimer
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="chauffeurs.length === 0">
              <td colspan="5" class="text-center no-data">
                <i class="bi bi-exclamation-circle"></i> Aucun chauffeur enregistré
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
