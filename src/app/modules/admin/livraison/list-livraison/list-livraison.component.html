<app-navbar></app-navbar>

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">📦 Liste des Livraisons</h4>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark text-center">
            <tr>
              <th>ID</th>
              <th>Client</th>
              <th>Adresse de Livraison</th>
              <th>Statut</th>
              <th>Chauffeur</th>
              <th>Actions</th>
              <th>Détails</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let livraison of livraisons">
              <td>{{ livraison.id }}</td>
              <td>{{ livraison.client }}</td>
              <td>{{ livraison.adresseLivraison }}</td>
              <td>
                <span class="badge bg-info text-dark">{{ livraison.statut }}</span>
              </td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <select class="form-select form-select-sm" [(ngModel)]="livraison.selectedChauffeurId">
                    <option *ngFor="let chauffeur of chauffeurs" [value]="chauffeur.id">
                      {{ chauffeur.nom }}
                    </option>
                  </select>
                  <button class="btn btn-sm btn-success" (click)="assignChauffeur(livraison.id, livraison.selectedChauffeurId)">
                    Réassigner
                  </button>
                </div>
              </td>
              <td>
                <button (click)="deleteLivraison(livraison.id)" class="btn btn-sm btn-danger">
                  Supprimer
                </button>
              </td>
              <td>
                <a [routerLink]="['/admin/livraison/livraison-details', livraison.id]" class="btn btn-sm btn-outline-primary">
                  Voir détails
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
