<app-navbar></app-navbar>

<div class="container mt-5">
  <h2 class="mb-4 text-primary fw-bold">📦 Mes Livraisons</h2>

  <div class="table-responsive shadow-sm rounded-4 border border-light-subtle">
    <table class="table table-hover align-middle">
      <thead class="table-light text-center">
        <tr>
          <th>#</th>
          <th>Adresse</th>
          <th>Client</th>
          <th>Admin</th>
          <th>Statut</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody *ngIf="livraisons.length > 0; else noData">
        <tr *ngFor="let l of livraisons" class="text-center">
          <td>{{ l.id }}</td>
          <td>{{ l.adresseLivraison }}</td>
          <td>{{ l.client }}</td>
          <td>{{ l.admin?.nom || '—' }}</td>
          <td>
            <span
              class="badge px-3 py-2 fs-6"
              [ngClass]="{
                'bg-warning text-dark': l.statut === 'En cours',
                'bg-success': l.statut === 'Livrée',
                'bg-danger': l.statut === 'Annulée'
              }"
            >
              {{ l.statut }}
            </span>
          </td>
          <td>
            <ng-container *ngIf="isEncours(l.statut); else actionFinie">
              <button
                class="btn btn-outline-success btn-sm me-2"
                (click)="changerStatut(l.id, 'Livrée')"
              >
                ✅ Terminer
              </button>
              <button
                class="btn btn-outline-danger btn-sm"
                (click)="changerStatut(l.id, 'Annulée')"
              >
                ❌ Rejeter
              </button>
            </ng-container>
            <ng-template #actionFinie>
              <span class="text-muted">✔️ Fini</span>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noData>
    <div class="alert alert-info text-center mt-4" role="alert">
      Aucune livraison assignée pour le moment.
    </div>
  </ng-template>
</div>
