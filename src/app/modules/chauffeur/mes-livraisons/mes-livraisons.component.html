<app-navbar></app-navbar>
<app-chatbot></app-chatbot>

<div class="deliveries-container">
  <div class="container py-4">
    <!-- Header avec bouton d'action -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0 text-gradient fw-bold">
          <i class="bi bi-truck me-2"></i>Mes Livraisons
        </h2>
        <p class="text-muted mb-0">Gestion de vos missions de livraison</p>
      </div>

    </div>

    <!-- Filtres et recherche -->
    <div class="card filters-card mb-4 border-0 shadow-sm">
      <div class="card-body p-3">
        <div class="row g-3 align-items-center">
          <div class="col-md-3">
           <select class="form-select form-select-sm" [(ngModel)]="selectedStatus">
         <option value="Tous les statuts">Tous les statuts</option>
         <option value="En cours">En cours</option>
         <option value="Livrée">Livrée</option>
         <option value="Annulée">Annulée</option>
            </select>

          </div>


          <div class="col-md-2 text-end">
            <button class="btn btn-sm btn-outline-secondary w-100">
              <i class="bi bi-funnel"></i> Filtrer
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tableau des livraisons -->
    <div class="card border-0 shadow-lg overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">#ID</th>
              <th>Destinataire</th>
              <th>Adresse</th>
              <th class="text-center">Statut</th>
              <th class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody *ngIf="livraisons.length > 0; else noData">
<tr *ngFor="let l of livraisons | statusFilter:selectedStatus" class="delivery-item">
              <td class="ps-4 fw-semibold">#{{ l.id }}</td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="avatar-sm bg-light rounded-circle me-2 d-flex align-items-center justify-content-center">
                    <i class="bi bi-person text-primary"></i>
                  </div>
                  <div>
                    <h6 class="mb-0">{{ l.client }}</h6>
                    <small class="text-muted">{{ l.admin?.nom || 'Non assigné' }}</small>
                  </div>
                </div>
              </td>
              <td>
                <div class="d-flex align-items-center">
                  <i class="bi bi-geo-alt text-muted me-2"></i>
                  <span>{{ l.adresseLivraison }}</span>
                </div>
              </td>


              <td class="text-center">
                <span class="badge rounded-pill py-2 px-3 status-badge"
                      [ngClass]="{
                        'bg-warning-light text-warning': l.statut === 'En cours',
                        'bg-success-light text-success': l.statut === 'Livrée',
                        'bg-danger-light text-danger': l.statut === 'Annulée'
                      }">
                  <i class="bi me-1" [ngClass]="{
                    'bi-hourglass': l.statut === 'En cours',
                    'bi-check-circle': l.statut === 'Livrée',
                    'bi-x-circle': l.statut === 'Annulée'
                  }"></i>
                  {{ l.statut }}
                </span>
              </td>
              <td class="text-end pe-4">
                <ng-container *ngIf="isEncours(l.statut); else actionFinie">
                  <button class="btn btn-sm btn-success rounded-pill me-2 px-3"
                          (click)="changerStatut(l.id, 'Livrée')"
                          tooltip="Marquer comme livrée">
                    <i class="bi bi-check-lg me-1"></i> Terminer
                  </button>
                  <button class="btn btn-sm btn-outline-danger rounded-pill px-3"
                          (click)="changerStatut(l.id, 'Annulée')"
                          tooltip="Annuler la livraison">
                    <i class="bi bi-x-lg me-1"></i> Annuler
                  </button>
                </ng-container>
                <ng-template #actionFinie>
                  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                          tooltip="Voir les détails">
                    <i class="bi bi-eye me-1"></i> Détails
                  </button>
                </ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <ng-template #noData>
      <div class="empty-state text-center py-5">
        <div class="empty-icon mb-3">
          <i class="bi bi-truck text-muted" style="font-size: 3rem;"></i>
        </div>
        <h5 class="mb-2">Aucune livraison trouvée</h5>
        <p class="text-muted mb-4">Vous n'avez aucune livraison assignée pour le moment.</p>
        <button class="btn btn-primary rounded-pill px-4">
          <i class="bi bi-arrow-repeat me-2"></i>Rafraîchir
        </button>
      </div>
    </ng-template>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center mt-4">


    </div>
  </div>
</div>
