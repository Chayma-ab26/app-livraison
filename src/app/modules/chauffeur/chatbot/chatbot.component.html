<!-- Bouton flottant du chatbot -->
<button
  (click)="toggleChat()"
  style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;
         border-radius: 50%; width: 60px; height: 60px;
         background-color: #007bff; color: white; border: none; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
  💬
</button>

<!-- Fenêtre du chatbot (popup) -->
<div *ngIf="isOpen"
     style="position: fixed; bottom: 90px; right: 20px; width: 320px; height: 460px;
            background: white; border-radius: 8px; border: 1px solid #ccc;
            z-index: 1000; box-shadow: 0 0 15px rgba(0,0,0,0.3); display: flex; flex-direction: column;">

  <!-- Header -->
  <div style="background: #007bff; color: white; padding: 10px; display: flex; justify-content: space-between;">
    <span>Assistant Livraison</span>
    <button (click)="toggleChat()" style="background: transparent; border: none; color: white;">✖</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messageContainer style="flex: 1; padding: 10px; overflow-y: auto;">
    <div *ngFor="let msg of messages" [ngClass]="['message-bubble', msg.sender]">
      <div class="message-content">
        <div class="message-sender">
          <span *ngIf="msg.sender === 'user'" class="sender-name">Vous</span>
        </div>
        <div class="message-text">{{ msg.text }}</div>
      </div>
    </div>

    <!-- Typing -->
    <div *ngIf="loading" class="message-bubble assistant typing-indicator">
      <div class="message-content">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area" style="padding: 10px; border-top: 1px solid #ccc;">
    <div class="input-group">
      <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()"
             placeholder="Posez une question..." class="form-control">
      <button (click)="sendMessage()" [disabled]="loading || !userInput.trim()"
              class="btn btn-primary" type="button">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <small class="text-muted">
      <i class="bi bi-lightbulb"></i> Ex. : "Itinéraire pour livraison", "Météo à Lyon"
    </small>
  </div>
</div>
