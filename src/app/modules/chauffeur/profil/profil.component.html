<app-navbar></app-navbar>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-3">
        <div class="card-body p-4">
          <h3 class="card-title text-center text-primary mb-4">Mon Profil</h3>

          <!-- Gestion des erreurs -->
          <div *ngIf="errorMessage" class="alert alert-danger text-center">
            {{ errorMessage }}
          </div>

          <!-- Vérification si les données sont chargées -->
          <div *ngIf="user; else loading" class="text-center">
            <p class="fw-bold fs-5"><strong>Nom :</strong> {{ user.nom }}</p>
            <p class="fw-bold fs-5"><strong>Email :</strong> {{ user.email }}</p>
            <p class="fw-bold fs-5"><strong>Rôle :</strong> {{ user.role }}</p>
          </div>

          <!-- Loader en attendant les données -->
          <ng-template #loading>
            <div class="text-center">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Chargement...</span>
              </div>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
